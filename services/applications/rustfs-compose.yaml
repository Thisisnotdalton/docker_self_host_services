secrets:
  rustfs_oauth_cookie_secret:
    file: ${OAUTH_CONFIG_DIR}/rustfs/oauth_cookie_secret
  rustfs_oauth_client_secret:
    file: ${OAUTH_CONFIG_DIR}/rustfs/oauth_client_secret

volumes:
  rustfs_data:
    name: "${HOST}.${DOMAIN}-rustfs_data"

services:
  rustfs-oauth2-proxy:
    hostname: oauth2-proxy-rustfs
    extends:
      file: ../auth/proxy/compose.oauth2_proxy_base.yaml
      service: oauth2-proxy-base
    secrets:
      - rustfs_oauth_cookie_secret
      - rustfs_oauth_client_secret
    labels:
      - "traefik.http.routers.rustfs-oauth2-proxy.service=rustfs-oauth2-proxy"
      - "traefik.http.services.rustfs-oauth2-proxy.loadbalancer.server.port=4180"
      - "traefik.http.services.rustfs-oauth2-proxy.loadbalancer.passhostheader=true"
    volumes:
      - "${OAUTH_CONFIG_DIR}/rustfs/oauth2-proxy.cfg:/oauth2-proxy.cfg"
    # RustFS main service
  rustfs:
    extends:
      file: common.yaml
      service: application
    security_opt:
      - "no-new-privileges:true"
    image: "${RUSTFS_IMAGE_TAG}"
    depends_on:
      rustfs-oauth2-proxy:
        condition: service_healthy
    labels:
      - "traefik.http.routers.rustfs.service=rustfs"
      - "traefik.http.services.rustfs.loadbalancer.server.port=9001"
      - "traefik.http.services.rustfs.loadbalancer.passhostheader=true"
    ports:
      - "9000:9000" # S3 API port
    environment:
      - RUSTFS_VOLUMES=/data/rustfs{0..3} # Define 4 storage volumes
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
    volumes:
      - rustfs_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "sh", "-c",
          "curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/rustfs/console/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s