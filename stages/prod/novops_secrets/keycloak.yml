environments:
  prod:
    variables:
      - name: KEYCLOAK_POSTGRES_USER
        value:
          bitwarden:
            entry: scriptkitties-club-keycloak_postgres_user
            field: login.username

      - name: KEYCLOAK_POSTGRES_PASSWORD
        value:
          bitwarden:
            entry: scriptkitties-club-keycloak_postgres_user
            field: login.password

      - name: KEYCLOAK_ADMIN
        value:
          bitwarden:
            entry: scriptkitties-club-keycloak_admin
            field: login.username

      - name: KEYCLOAK_ADMIN_PASSWORD
        value:
          bitwarden:
            entry: scriptkitties-club-keycloak_admin
            field: login.password

      - name: tofu_state_encryption_passphrase
        value:
          bitwarden:
             entry: scriptkitties-club-tofu_state_encryption_passphrase
             field: login.password